<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main id="wrapper">
      <div class="image">
        <img
          src="./images/image-product-mobile.jpg"
          alt="perfume glass"
          class="mobile-hero"
        />
        <img
          src="./images/image-product-desktop.jpg"
          alt="perfume glass"
          class="desktop-hero"
        />
      </div>
      <section class="design">
        <p class="pre">PERFUME</p>
        <div>
          <h1 class="perfume">Gabrielle Essence Eau De Parfum</h1>
          <p class="about">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
        </div>
        <div class="price">
          <p class="new-price">$149.99</p>

          <p class="old-price">$169.99</p>
        </div>
        <div class="btn">
          <button type="submit" class="btn-cart">
            <img src="./images/icon-cart.svg" alt="cart" class="cart-icon" />Add
            to Cart
          </button>
        </div>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Chukwuma Cecilia</a>.
    </footer>
  </body>
</html>
